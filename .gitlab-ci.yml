# GitLab CI/CD: build the static site, publish to GitLab Pages, and mirror it
# to the OVH shared-hosting account over SFTP.
#
# Jobs:
#   * pages       — copies the static files into public/ and lets GitLab Pages
#                   publish them. Reserved job name; runs only on the default
#                   branch.
#   * deploy:ovh  — uploads the same public/ tree to OVH over SFTP (incremental
#                   mirror). Dormant until the OVH_PASSWORD variable is set.
#
# One-time setup for the OVH deploy:
#   Settings → CI/CD → Variables → add `OVH_PASSWORD`
#     * Value:      your OVH SSH/SFTP password
#     * Type:       Variable
#     * Flags:      Masked + Protected   (Protected = default branch only)
#   Until that variable exists, deploy:ovh is skipped, so the pipeline stays
#   green and GitLab Pages keeps deploying on its own.
#
# Optional hardening — pin OVH's SSH host key (recommended):
#   Settings → CI/CD → Variables → add `OVH_KNOWN_HOSTS`
#     * Value: the output of `ssh-keyscan ssh.cluster100.hosting.ovh.net`
#     * Type:  Variable   (Protected; masking not possible / not needed)
#   When set, the deploy verifies the server against this pinned key (strict).
#   When unset, it falls back to trust-on-first-use (accept-new).

stages:
  - deploy
  - upload

pages:
  stage: deploy
  image: alpine:3.22                       # pin to a specific stable version
  publish: public                          # tell GitLab Pages exactly what to publish
  script:
    - mkdir -p public
    - cp -r index.html .htaccess LICENSE assets public/
    - echo "Deployed files:"
    - ls -la public/
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:ovh:
  stage: upload
  image: alpine:3.22
  needs: ["pages"]                         # reuse the public/ tree pages built
  timeout: 10 minutes                      # backstop — never burn the full 1h
  variables:
    OVH_HOST: "ssh.cluster100.hosting.ovh.net"
    OVH_USERNAME: "ledgern"
    OVH_REMOTE_PATH: "/homez.2244/ledgern/www"
  script:
    - apk add --no-cache lftp openssh-client sshpass netcat-openbsd
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # Fail fast if this runner can't reach OVH's SFTP port (e.g. an internal
    # runner with no outbound internet) instead of hanging until the timeout.
    - |
      echo "Checking TCP reachability to $OVH_HOST:22 ..."
      if ! nc -z -w 10 "$OVH_HOST" 22; then
        echo "ERROR: cannot reach $OVH_HOST:22 from this runner."
        echo "This runner appears to have no outbound access to OVH."
        echo "Either run deploy:ovh on a runner with internet egress (tags:),"
        echo "or deploy from a machine that can reach OVH (see README)."
        exit 1
      fi
      echo "Reachable."
    # sshpass -e reads the password from \$SSHPASS; export it from the masked
    # OVH_PASSWORD variable so it never appears on a command line.
    - export SSHPASS="$OVH_PASSWORD"
    # Pin the server's host key if OVH_KNOWN_HOSTS is provided (strict), else
    # fall back to trust-on-first-use so the job still works without it.
    - |
      if [ -n "$OVH_KNOWN_HOSTS" ]; then
        printf '%s\n' "$OVH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
        SSH_STRICT=yes
        echo "Host key pinned from OVH_KNOWN_HOSTS (strict checking)."
      else
        SSH_STRICT=accept-new
        echo "WARNING: OVH_KNOWN_HOSTS not set — using trust-on-first-use."
      fi
    # `mirror -R` is reverse (local → remote) and incremental — only changed
    # files transfer. `--delete` removes remote files no longer in the repo,
    # making the server an exact copy of public/. The dummy password in the URL
    # stops lftp's own prompt; real auth is done by ssh via sshpass. Timeouts
    # and a retry cap ensure a stalled connection fails in seconds, not an hour.
    - >
      lftp -c "
      set net:timeout 15;
      set net:max-retries 2;
      set net:reconnect-interval-base 5;
      set sftp:auto-confirm yes;
      set sftp:connect-program 'sshpass -e ssh -a -x -o BatchMode=no -o ConnectTimeout=15 -o StrictHostKeyChecking=$SSH_STRICT -o UserKnownHostsFile=~/.ssh/known_hosts';
      open -u $OVH_USERNAME,dummy sftp://$OVH_HOST;
      mirror -R --delete --verbose public/ $OVH_REMOTE_PATH
      "
  rules:
    # Runs only on the default branch, and only once OVH_PASSWORD is configured.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $OVH_PASSWORD
