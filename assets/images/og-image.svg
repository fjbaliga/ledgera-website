<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Ledgera — The Modular Distributed Ledger">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfaff"/>
      <stop offset="100%" stop-color="#f0eef9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="glow1" cx="92%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <rect x="100" y="220" width="120" height="6" rx="3" fill="url(#brand)"/>

  <text x="100" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="160" font-weight="800" fill="url(#brand)" letter-spacing="-6">Ledgera</text>

  <text x="100" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="600" fill="#0f0a24" letter-spacing="-0.5">The Modular Distributed Ledger</text>

  <text x="100" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#5b5677">Verifiable coordination — without the consensus overhead.</text>

  <g transform="translate(900 280)" opacity="0.9">
    <rect x="-60" y="-60" width="120" height="120" rx="22" fill="url(#brand)"/>
    <path d="M-22 18 L0 -26 L22 18 Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="0" cy="24" r="4.5" fill="#ffffff"/>
  </g>
</svg>
